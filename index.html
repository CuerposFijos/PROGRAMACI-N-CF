<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Producción</title>

    <!-- Estilos de Bootstrap y Bootstrap Icons -->
<link rel="stylesheet" href="css/bootstrap.min.css">
<link rel="stylesheet" href="css/bootstrap-icons.min.css">

    <style>
        body {
            min-height: 100vh;
            background-color: #f8f9fa;
        }

        /* Estilos de la barra lateral */
        .sidebar {
            width: 250px;
            min-height: 100vh;
            transition: all 0.3s ease;
        }

        .sidebar.collapsed {
            width: 70px;
        }

        .sidebar.collapsed .link-text,
        .sidebar.collapsed .dropdown-toggle::after {
            display: none;
        }

        .sidebar.collapsed .nav-link {
            text-align: center;
            padding: 10px 0;
        }

        /* Área de contenido principal */
        .main-content {
            flex-grow: 1;
            padding: 25px;
            overflow-y: auto;
        }
    </style>
</head>

<body class="d-flex">

    <!-- BARRA LATERAL ESTILO BOOTSTRAP -->
    <div id="sidebar" class="sidebar bg-light border-end p-3 d-flex flex-column flex-shrink-0" style="width: 280px; min-height: 100vh;">
        
        <!-- Título superior -->
        <a href="#" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-dark text-decoration-none">
            <span class="fs-4 fw-bold">Mi Menú</span>
        </a>
        <hr>

        <!-- Lista de opciones -->
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item mb-1">
                <!-- Opción activa (resaltada en azul) -->
                <a href="#" id="link-inicio" class="nav-link active text-white" aria-current="page">
                    <i class="bi bi-house-door me-2"></i> Inicio
                </a>
            </li>
            <li class="nav-item mb-1">
                <!-- Opción normal -->
                <a href="#" id="link-registros" class="nav-link link-dark">
                    <i class="bi bi-table me-2"></i> Registros
                </a>
            </li>
        </ul>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="main-content p-4">
<!-- SECCIÓN 1: INICIO (Visible por defecto) -->
    <div id="seccion-inicio">
        <h2>Panel de Control</h2>
        <p class="text-muted">Bienvenido al sistema de seguimiento de producción.</p>
    </div>

    <!-- SECCIÓN 2: REGISTROS (Oculta por defecto usando la clase d-none) -->
    <div id="seccion-registros" class="d-none">
        <h2>Registros de Producción</h2>
        <p class="text-muted">Aquí mostraremos la tabla próximamente.</p>
    </div>
    </div>

</body>
