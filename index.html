<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Producción</title>

    <!-- Estilos de Bootstrap y Bootstrap Icons -->
<link rel="stylesheet" href="css/bootstrap.min.css">
<link rel="stylesheet" href="css/bootstrap-icons.min.css">

    <style>
        body {
            min-height: 100vh;
            background-color: #f8f9fa;
        }

        /* Estilos de la barra lateral */
        .sidebar {
            width: 250px;
            min-height: 100vh;
            transition: all 0.3s ease;
        }

        .sidebar.collapsed {
            width: 70px;
        }

        .sidebar.collapsed .link-text,
        .sidebar.collapsed .dropdown-toggle::after {
            display: none;
        }

        .sidebar.collapsed .nav-link {
            text-align: center;
            padding: 10px 0;
        }

        /* Área de contenido principal */
        .main-content {
            flex-grow: 1;
            padding: 25px;
            overflow-y: auto;
        }
    </style>
</head>

<body class="d-flex">

    <!-- 1. AQUÍ LLAMAS A LA BARRA LATERAL -->
    <div id="sidebar" class="sidebar bg-light, text-dark p-3 d-flex flex-column">
        <h3>Mi Menú</h3>
        <ul class="nav flex-column mt-3">
            <li class="nav-item mb-2">
                <a href="#" class="nav-link text-white active">
                    <i class="bi bi-house-door me-2"></i> Inicio
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link text-white">
                    <i class="bi bi-table me-2"></i> Registros
                </a>
            </li>
        </ul>
    </div>

    <!-- 2. AQUÍ LLAMAS AL CONTENIDO PRINCIPAL A LA DERECHA -->
    <div class="main-content">
        <h1>Panel de Control de Producción</h1>
        <p>Aquí es donde mostraremos tu tabla de datos más adelante.</p>
    </div>

</body>
